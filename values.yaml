image:
  tag: ""

puid: 1000
pgid: 1000

timezone: UTC

apiKey:
  secretKeyRef:
    name: ""
    key: api-key

postgres:
  host: ""
  port: 5432
  databases:
    main: sonarr-main
    log: sonarr-log
  username:
    secretKeyRef:
      name: ""
      key: username
  password:
    secretKeyRef:
      name: ""
      key: password

resources: {}

probes:
  liveness:
    timeoutSeconds: 1
  readiness:
    timeoutSeconds: 1

persistence:
  config:
    existingClaim: ""
    storageClassName: ""
    size: 2Gi
  data: []

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
