suite: PersistentVolumeClaim
release:
  name: sonarr
templates:
  - templates/persistentvolumeclaim.yaml
values:
  - ../ci/kind-values.yaml
tests:
  - it: creates a claim for /config and /data in the default storage class
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: sonarr-config
        documentIndex: 0
      - equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 2Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: sonarr-data
        documentIndex: 1
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 1

  - it: uses the storage class when one is set
    set:
      persistence.config.storageClassName: fast
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 0

  - it: creates no claim for an existing one
    set:
      persistence.data.existingClaim: my-data
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sonarr-config

  - it: fails when /data has neither an existing claim nor a size
    set:
      persistence.data.size: ""
    asserts:
      - failedTemplate:
          errorMessage: persistence.data.existingClaim or persistence.data.size is required
