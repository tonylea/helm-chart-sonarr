suite: PersistentVolumeClaim
release:
  name: sonarr
templates:
  - templates/persistentvolumeclaim.yaml
values:
  - ../ci/kind-values.yaml
tests:
  - it: creates a claim for /config and each data mount in the default storage class
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: sonarr-config
        documentIndex: 0
      - equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 2Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: sonarr-data-downloads
        documentIndex: 1
      - equal:
          path: metadata.name
          value: sonarr-data-tv
        documentIndex: 2
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 2

  - it: uses the storage class when one is set
    set:
      persistence.data:
        - name: tv
          storageClassName: fast
          size: 1Gi
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 1

  - it: creates no claim for an existing one
    set:
      persistence.config.existingClaim: my-config
      persistence.data:
        - name: downloads
          existingClaim: my-downloads
        - name: tv
          size: 1Gi
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sonarr-data-tv

  - it: fails when a data mount has neither an existing claim nor a size
    set:
      persistence.data:
        - name: tv
    asserts:
      - failedTemplate:
          errorMessage: persistence.data mount tv needs an existingClaim or a size

  - it: fails when /config has neither an existing claim nor a size
    set:
      persistence.config.size: ""
    asserts:
      - failedTemplate:
          errorMessage: persistence.config needs an existingClaim or a size
