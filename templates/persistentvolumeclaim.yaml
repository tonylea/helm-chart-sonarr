{{- $claims := list (dict "path" "persistence.config" "suffix" "config" "volume" .Values.persistence.config) }}
{{- range .Values.persistence.data }}
{{- $name := required "each persistence.data mount needs a name" .name }}
{{- $claims = append $claims (dict "path" (printf "persistence.data mount %s" $name) "suffix" (printf "data-%s" $name) "volume" .) }}
{{- end }}
{{- range $claims }}
{{- if not .volume.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ .suffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sonarr.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .volume.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ required (printf "%s needs an existingClaim or a size" .path) .volume.size }}
{{- end }}
{{- end }}
